[package]
name = "cleaner-cli"
version = "0.1.0"
edition = "2021"
authors = ["weaztoven"]
description = "A fast and lightweight CLI tool in Rust to find and clean developer junk like node_modules, target, and dist."
license = "MIT"
repository = "https://github.com"
readme = "readme.md"
keywords = ["cli", "cleanup", "rust", "node-modules", "productivity"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
colored = "2.1"
indicatif = { version = "0.17", features = ["tokio"] }